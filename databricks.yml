# Declarative Automation Bundle: Payments Analytics Genie agent with CI/CD.
# Docs: https://docs.databricks.com/dev-tools/bundles/
bundle:
  name: genie_cicd_example
  engine: direct
  databricks_cli_version: ">= 1.21.0"

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL warehouse the Genie agent runs queries on (looked up by name).
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    # Development mode prefixes the agent title with "[dev <user>]".
    mode: development
    default: true
    workspace:
      host: https://dbc-9d246aea-02b4.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-9d246aea-02b4.cloud.databricks.com

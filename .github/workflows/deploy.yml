name: Genie agent CI/CD

# PRs into dev/main: validate + plan.  Push to dev -> deploy dev.  Push to main -> deploy prod.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: false

env:
  TARGET: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  validate:
    name: Validate (${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --strict -t "$TARGET"

      - name: Plan
        run: databricks bundle plan -t "$TARGET"

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'prod' || 'dev' }})
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      # Adopt manually created agents into prod state (as the CI service principal),
      # so deploys update them instead of creating copies. No-op once bound.
      - name: Bind existing resources (prod)
        if: env.TARGET == 'prod'
        run: |
          bind() {  # <resource type> <resource key> <existing workspace id>
            current=$(databricks bundle summary -t "$TARGET" -o json | jq -r ".resources.$1.$2.id // empty")
            if [ -z "$current" ]; then
              databricks bundle deployment bind "$2" "$3" -t "$TARGET" --auto-approve
            elif [ "$current" != "$3" ]; then
              echo "::error::$1.$2 is already bound to $current, expected $3"; exit 1
            else
              echo "$1.$2 already bound to $3"
            fi
          }
          bind genie_spaces bakehouse 01f1dc77c97310df926755c0122fdd8b

      - name: Deploy bundle
        run: databricks bundle deploy -t "$TARGET" --auto-approve

      - name: Summary
        run: databricks bundle summary -t "$TARGET"
